<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RewardGo Web - Redirigiendo...</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #241751;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .loader {
      font-size: 18px;
      color: #FFB800;
      font-weight: bold;
    }
  </style>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const ref = urlParams.get('ref') || '';
    // Tu URL oficial comprobada de Firebase Hosting
    const firebaseWebUrl = "https://bdrewardgo.web.app";

    window.addEventListener('DOMContentLoaded', () => {
      let destinationUrl = firebaseWebUrl;
      if (ref) {
        destinationUrl += `/?ref=${encodeURIComponent(ref)}`;
      }
      // Redirección instantánea a la versión web activa
      window.location.replace(destinationUrl);
    });
  </script>
</head>
<body>
  <div class="loader">
    🎁 Abriendo RewardGo Web...
  </div>
</body>
</html>
