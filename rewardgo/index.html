<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RewardGo - Redirigiendo...</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #241751;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .loader {
      font-size: 18px;
      color: #FFB800;
      font-weight: bold;
    }
  </style>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const ref = urlParams.get('ref') || '';
    const packageId = "com.mycompany.rewardgo";
    const firebaseWebUrl = "[suspicious link removed]";

    // Detectar si el usuario navega desde un dispositivo móvil
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    window.addEventListener('DOMContentLoaded', () => {
      if (isMobile) {
        // En móvil, redirigir inmediatamente a Google Play con el código de referido
        let playStoreUrl = `[suspicious link removed]{packageId}`;
        if (ref) {
          playStoreUrl += `&referrer=utm_source%3Dreferral%26utm_content%3D${encodeURIComponent(ref)}`;
        }
        window.location.replace(playStoreUrl);
      } else {
        // En PC/Escritorio, redirigir inmediatamente a la app Web
        let webUrl = firebaseWebUrl;
        if (ref) {
          webUrl += `/?ref=${encodeURIComponent(ref)}`;
        }
        window.location.replace(webUrl);
      }
    });
  </script>
</head>
<body>
  <div class="loader">
    🎁 Redirigiendo a RewardGo...
  </div>
</body>
</html>
